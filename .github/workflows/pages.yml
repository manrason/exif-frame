name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect site files
        # GitHub Pages lets browsers cache files for 10 minutes. Stamping script and
        # style URLs with the commit makes every deploy load matching files, instead
        # of a new page running an old cached script.
        run: |
          mkdir _site && cp -r index.html src _site/
          v="${GITHUB_SHA::8}"
          sed -i "s#src/styles.css#src/styles.css?v=$v#; s#src/app.js#src/app.js?v=$v#" _site/index.html
          sed -i "s#'./exif.js'#'./exif.js?v=$v'#" _site/src/app.js
          grep -q "app.js?v=$v" _site/index.html && grep -q "exif.js?v=$v" _site/src/app.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
